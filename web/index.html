<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <title>Shopping list</title>
    <!--
      Applies the theme before the page is drawn, so a dark theme does not
      flash light while the app loads. Mirrors src/theme/index.js, which takes
      over once the app runs.
    -->
    <script>
      (function () {
        var stored = localStorage.getItem('shoppinglist.theme')
        var dark = stored === 'dark' ||
          (stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
