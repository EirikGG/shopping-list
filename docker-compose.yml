services:
  db:
    image: postgres:16
    command:
      - postgres
      - -p
      - "${DB_PORT}"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:${DB_PORT}:${DB_PORT}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${DB_USERNAME} -d ${DB_NAME} -p ${DB_PORT}
      interval: 5s
      timeout: 5s
      retries: 10
    profiles:
      - prod
      - test
      - dev


  app:
    build:
      context: rest/
      dockerfile: Dockerfile
    environment:
      JAVA_TOOL_OPTIONS: >-
        -DDB.HOSTNAME=db
        -DDB.PORT=${DB_PORT}
        -DDB.NAME=${DB_NAME}
        -DDB.USERNAME=${DB_USERNAME}
        -DDB.PASSWORD=${DB_PASSWORD}
        -DDB.POOL_SIZE=${DB_POOL_SIZE}
        -DAPP.PORT=${APP_PORT}
      # Plain variables, not -D options: JAVA_TOOL_OPTIONS is printed to the
      # log at startup, which would leak the API key.
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_API_KEY: ${MAIL_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # Rate limits use the client address the web proxy passes in X-Real-IP.
      # Safe only because the port below is not reachable from outside.
      TRUST_PROXY: "true"
      # Signs the login tokens. Changing it logs everyone out.
      JWT_SECRET: ${JWT_SECRET:-}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      LOG_LEVEL_ROOT: ${LOG_LEVEL_ROOT:-info}
    # Localhost only: browsers reach the backend through the web proxy, and a
    # direct connection could fake X-Real-IP. Docker publishes ports past the
    # firewall, so binding to 127.0.0.1 is what keeps it private.
    ports:
      - "127.0.0.1:${APP_PORT}:${APP_PORT}"
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - prod
      - test
      - dev


  # The built app served over HTTPS by Caddy, which also forwards /api to the
  # backend. See web/Caddyfile.
  web:
    build:
      context: web/
      dockerfile: Dockerfile
      target: prod
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-}
      API_TARGET: http://app:${APP_PORT}
    # 80 is needed too: Let's Encrypt checks the domain over it, and Caddy
    # redirects plain HTTP to HTTPS. 443/udp is HTTP/3.
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      # The certificates. Kept across rebuilds, as Let's Encrypt limits how
      # often a new one can be issued.
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - backend
    depends_on:
      - app
    profiles:
      - prod
      - test

  # The Vite dev server, with the source mounted for live reload.
  web-dev:
    build:
      context: web/
      dockerfile: Dockerfile
      target: dev
    environment:
      WEB_PORT: ${WEB_PORT}
      API_TARGET: http://app:${APP_PORT}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
    ports:
      - "${WEB_PORT}:${WEB_PORT}"
    networks:
      - backend
    depends_on:
      - app
    volumes:
      - ./web/src:/app/src
      - ./web/index.html:/app/index.html
    profiles:
      - dev

  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    restart: unless-stopped
    # Mailpit always listens on 8025 (web UI) and 1025 (SMTP) in the container.
    # The defaults keep this valid when prod's .env has no Mailpit settings,
    # since Compose reads every service, even those outside the active profile.
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "1025:1025"
    networks:
      - backend
    profiles:
      - test
      - dev


  backlog:
    build:
      context: backlog/
      dockerfile: Dockerfile.backlog
    init: true
    restart: unless-stopped
    working_dir: /repo
    volumes:
      - .:/repo
    ports:
      - "127.0.0.1:6420:16420"
    profiles:
      - dev

volumes:
  postgres-data:
  caddy-data:
  caddy-config:

networks:
  backend:
