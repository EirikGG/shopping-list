# Local development only. In production the app runs as a Home Assistant
# add-on, where HA logs users in and its ingress proxy passes on who they are.
# Here the Vite dev server plays that part (see web/vite.config.js).
services:
  app:
    build:
      context: rest/
      dockerfile: Dockerfile
    environment:
      JAVA_TOOL_OPTIONS: >-
        -DDB.FILE=/data/shoppinglist.db
        -DAPP.PORT=${APP_PORT}
      # Trusts the HA user headers from any address, as there is no Home
      # Assistant in front. Safe only because the port below is not reachable
      # from outside.
      INGRESS_PROXY: any
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      LOG_LEVEL_ROOT: ${LOG_LEVEL_ROOT:-info}
    # Localhost only: anyone who can reach the backend can claim to be any user.
    # Docker publishes ports past the firewall, so binding to 127.0.0.1 is what
    # keeps it private.
    ports:
      - "127.0.0.1:${APP_PORT}:${APP_PORT}"
    volumes:
      - app-data:/data
    networks:
      - backend
    profiles:
      - dev


  # The Vite dev server, with the source mounted for live reload. It forwards
  # /api to the backend as a made-up HA user.
  web-dev:
    build:
      context: web/
      dockerfile: Dockerfile
      target: dev
    environment:
      WEB_PORT: ${WEB_PORT}
      API_TARGET: http://app:${APP_PORT}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
      DEV_HA_USER_ID: ${DEV_HA_USER_ID:-dev-user}
      DEV_HA_USER_NAME: ${DEV_HA_USER_NAME:-Dev User}
    ports:
      - "127.0.0.1:${WEB_PORT}:${WEB_PORT}"
    networks:
      - backend
    depends_on:
      - app
    volumes:
      - ./web/src:/app/src
      - ./web/index.html:/app/index.html
    profiles:
      - dev


  backlog:
    build:
      context: backlog/
      dockerfile: Dockerfile.backlog
    init: true
    restart: unless-stopped
    working_dir: /repo
    volumes:
      - .:/repo
    ports:
      - "127.0.0.1:6420:16420"
    profiles:
      - dev

volumes:
  # The SQLite database, in /data as in the add-on.
  app-data:

networks:
  backend:
