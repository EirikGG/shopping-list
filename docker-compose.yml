services:
  db:
    image: postgres:16
    command:
      - postgres
      - -p
      - "${DB_PORT}"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:${DB_PORT}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${DB_USERNAME} -d ${DB_NAME} -p ${DB_PORT}
      interval: 5s
      timeout: 5s
      retries: 10

    profiles:
      - test
      - prod


  app:
    build:
      context: rest/
      dockerfile: Dockerfile
    environment:
      JAVA_TOOL_OPTIONS: >-
        -DDB.HOSTNAME=db
        -DDB.PORT=${DB_PORT}
        -DDB.NAME=${DB_NAME}
        -DDB.USERNAME=${DB_USERNAME}
        -DDB.PASSWORD=${DB_PASSWORD}
        -DDB.POOL_SIZE=${DB_POOL_SIZE}
        -DAPP.PORT=${APP_PORT}
        -DMAIL.HOST=mailpit
        -DMAIL.PORT=${MAIL_PORT}
    ports:
      - "${APP_PORT}:${APP_PORT}"
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy

    profiles:
      - test
      - prod


  web:
    build:
      context: web/
      dockerfile: Dockerfile
    environment:
      WEB_PORT: ${WEB_PORT}
      API_TARGET: http://app:${APP_PORT}
    ports:
      - "${WEB_PORT}:${WEB_PORT}"
    networks:
      - backend
    depends_on:
      - app
    volumes:
      - ./web/src:/app/src
      - ./web/index.html:/app/index.html

    profiles:
      - test
      - prod

  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    restart: unless-stopped

    ports:
      - "8025:${MAILPIT_UI_PORT}"
      - "1025:${MAIL_PORT}"

    networks:
      - backend

    profiles:
      - test


  backlog:
    build:
      context: backlog/
      dockerfile: Dockerfile.backlog
    init: true
    restart: unless-stopped
    working_dir: /repo
    volumes:
      - .:/repo
    ports:
      - "127.0.0.1:6420:16420"

volumes:
  postgres-data:

networks:
  backend: